<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pinterest</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="assets/logo.svg"/></a>
        <a href="explore.html" class="cursor-pointer">Explore</a>
        <div class="flex-1"></div>
        <a href="create.html" class="cursor-pointer">Create</a>
        <a href="login.html">
            <button class="">Login</button>
        </a>
        <a href="register.html">
            <button class="sign-up-button">Signup</button>
        </a>
    </header>

    <main class="login-main">
        <div class="login-container">
            <h2 class="login-title">Welcome back</h2>
            
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" placeholder="Email" />
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" placeholder="Password" />
            </div>

            <button class="login-button">Log in</button>

            <a href="#" class="forgot-password">Forgot your password?</a>

            <div class="register-link-container">
                Not on Pinterest yet? <a href="register.html" class="register-link">Sign up</a>
            </div>
        </div>
    </main>
</body>
</html>
