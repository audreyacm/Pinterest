<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Pinterest</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="assets/logo.svg"/></a>
        <a href="explore.html" class="cursor-pointer">Explore</a>
        <div class="flex-1"></div>
        <a href="create.html" class="cursor-pointer">Create</a>
        <a href="login.html">
            <button class="">Login</button>
        </a>
        <a href="register.html">
            <button class="sign-up-button">Signup</button>
        </a>
    </header>

    <main class="register-main">
        <div class="register-container">
            <h2 class="register-title">Welcome to Pinterest</h2>
            
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" placeholder="Email" />
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" placeholder="Create a password" />
            </div>

            <div class="input-group">
                <label class="input-label">Confirm Password</label>
                <input type="password" class="input-field" placeholder="Confirm your password" />
            </div>

            <button class="register-button">Continue</button>

            <div class="login-link-container">
                Already a member? <a href="login.html" class="login-link">Log in</a>
            </div>
        </div>
    </main>
</body>
</html>
